<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Paisa Safar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: full-bleed pixel canvas; phone and menus dock at the top (portrait) or right (landscape) so the runner stays visible */
:root{
  --ink:#0d0a16; --panel:#1c1533; --panel-hi:#2a2049; --edge:#4c3b7d; --text:#f5eddd; --muted:#b9add6;
  --gold:#ffc83a; --saffron:#ff8a24; --safe:#3fd0b6; --danger:#ff5d73; --board:#f6c91c; --board-ink:#141014;
  --f-pixel:"Pixelify Sans","Baloo 2",ui-monospace,monospace;
  --f-body:"Baloo 2","Nirmala UI","Mangal",system-ui,sans-serif;
  --step:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px));
  --step-s:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  --dockmax:70vh;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--text);overflow:hidden}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;background:#0d0a16}
#crt{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.5}
#crt[hidden]{display:none}
#probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

button{font:inherit;color:inherit}
.btn{font-family:var(--f-pixel);font-weight:700;font-size:16px;letter-spacing:.02em;line-height:1.2;color:#1d1206;background:var(--gold);border:0;padding:12px 14px;min-height:48px;cursor:pointer;clip-path:var(--step-s);box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.35)}
.btn:focus-visible{box-shadow:inset 0 0 0 3px #fff,inset 0 -4px 0 rgba(0,0,0,.3)}
.btn.safe{background:var(--safe);color:#06201c}
.btn.ghost{background:var(--panel-hi);color:var(--text);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.08)}
.btn.ghost:focus-visible{box-shadow:inset 0 0 0 3px var(--gold)}
.btn.small{min-height:40px;font-size:14px;padding:8px 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
.btn svg{width:18px;height:18px;flex:none}
.pulse{animation:pulse 1.1s steps(2) infinite}
@keyframes pulse{50%{filter:brightness(1.25);transform:translateY(-1px)}}

#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.icon-btn{position:relative;width:44px;height:44px;border:0;background:rgba(18,12,34,.72);clip-path:var(--step-s);display:grid;place-items:center;cursor:pointer;color:var(--text)}
.icon-btn svg{width:22px;height:22px}
.icon-btn:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--gold)}
#pause-btn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(10px,env(safe-area-inset-right,0px))}

#title-ui{position:fixed;left:0;right:0;top:var(--tui-top,46%);display:flex;flex-direction:column;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#title-ui .tag{margin:0;font-weight:600;font-size:17px;text-align:center;max-width:30ch;text-wrap:balance;color:var(--text);text-shadow:0 2px 0 #140c1e,0 0 12px rgba(10,6,20,.8)}
#title-ui .acts{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
#title-ui .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#title-ui .fine{background:rgba(14,9,28,.74);padding:6px 10px;clip-path:var(--step-s);margin:0;font-size:13px;color:var(--text);opacity:.85;text-align:center;max-width:36ch;text-wrap:balance;text-shadow:0 1px 0 #140c1e,0 0 8px rgba(10,6,20,.9)}

#panel-wrap{position:fixed;inset:0;display:flex;pointer-events:none;padding-top:calc(env(safe-area-inset-top,0px) + 62px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#panel-wrap.top{align-items:flex-start;justify-content:center}
#panel-wrap.top .panel{max-height:var(--dockmax)}
#panel-wrap.right{align-items:center;justify-content:flex-end}
#panel-wrap.modal{align-items:center;justify-content:center;background:rgba(9,6,18,.62);pointer-events:auto;padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
.panel{pointer-events:auto;width:min(400px,100%);max-height:100%;overflow:auto;background:var(--panel);color:var(--text);clip-path:var(--step);box-shadow:inset 0 0 0 3px var(--edge),inset 0 7px 0 rgba(255,255,255,.05);padding:18px 16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;animation:rise .22s steps(4)}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.panel.still{animation:none}
.panel h2{margin:0;font-family:var(--f-pixel);font-weight:700;font-size:22px;line-height:1.15;text-wrap:balance}
.panel h3{margin:0;font-family:var(--f-pixel);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.panel p{margin:0}
.kicker{font-family:var(--f-pixel);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.list li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.list li .n{font-family:var(--f-pixel);font-weight:700;color:#1d1206;background:var(--gold);width:24px;height:24px;display:grid;place-items:center;clip-path:var(--step-s);font-size:13px;margin-top:2px}

/* Phone */
.panel.phone{padding:0;gap:0;background:#141024}
.ph-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 7px 16px;background:var(--app);color:#fff;font-family:var(--f-pixel);font-weight:700;font-size:14px;letter-spacing:.04em}
.ph-bar .clock{opacity:.9;font-variant-numeric:tabular-nums}
.ph-in{display:flex;flex-direction:column;gap:11px;padding:12px 14px 16px}
.ph-who{display:grid;grid-template-columns:40px 1fr 44px;gap:10px;align-items:center}
.ph-av{width:40px;height:40px;display:grid;place-items:center;font-family:var(--f-pixel);font-weight:700;font-size:18px;color:#fff;clip-path:var(--step-s)}
.ph-id{min-width:0}
.ph-id b{display:block;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.ph-id small{display:block;font-size:13px;color:var(--muted);line-height:1.25}
.ph-who .icon-btn{background:var(--panel-hi);width:40px;height:40px}
.bubble{background:#262040;border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:16px;line-height:1.45;overflow-wrap:anywhere}
.bubble.chat{background:#1f4436}
.bubble.channel{background:#1b3452}
.bubble.sms{background:#2a2b3f}
.bubble.app{background:#2f2058;border-radius:12px}
.bubble.post{background:#3a1d38}
.bubble.call{background:#16323a;font-style:italic}
.bubble.video{background:#3a1a1a}
.bubble .meta{display:block;margin-top:6px;font-size:13px;color:var(--muted);font-style:normal}
.vid{position:relative;overflow:hidden;clip-path:var(--step-s);background:#000}
.vid img{display:block;width:100%;image-rendering:pixelated;animation:glitch 2.4s steps(1) infinite}
.vid .live{position:absolute;left:8px;top:6px;font-family:var(--f-pixel);font-size:12px;background:#e8402a;color:#fff;padding:1px 6px}
@keyframes glitch{0%,100%{transform:none;filter:none}46%{transform:translateX(-3px);filter:hue-rotate(40deg) saturate(1.6)}47%{transform:translateX(4px)}48%{transform:none;filter:none}81%{transform:translateY(2px) skewX(-4deg);filter:contrast(1.4)}82%{transform:none;filter:none}}
.call{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 2px}
.call .ring{width:64px;height:64px;display:grid;place-items:center;font-family:var(--f-pixel);font-size:26px;font-weight:700;background:var(--safe);color:#06201c;clip-path:var(--step);animation:pulse 1s steps(2) infinite}
.call span{font-family:var(--f-pixel);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.urg{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;font-family:var(--f-pixel);font-size:13px;color:#ffd0d6}
.urg b{color:var(--danger);font-size:16px;font-variant-numeric:tabular-nums}
.urg i{grid-column:1/-1;display:block;height:6px;background:#3a1c2c}
.urg i em{display:block;height:100%;background:var(--danger);transition:width .25s linear}
.mithu{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.mithu img{width:44px;height:36px;image-rendering:pixelated}
.mithu p{background:#203a24;border-radius:12px 12px 12px 3px;padding:8px 10px;font-size:15px;line-height:1.35}
.mithu small{display:block;font-family:var(--f-pixel);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8be59a}
.acts{display:flex;flex-direction:column;gap:9px}
.acts .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.acts .three{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:7px}.acts .three .btn{padding:10px 6px;font-size:14px}
html.senior .panel{zoom:1.16;width:min(400px,calc((100vw - 32px)/1.16))}html.senior #title-ui{zoom:1.08}#b-senior{flex-direction:column;gap:1px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;background:#1e1838;padding:8px 10px;clip-path:var(--step-s)}
.checks .st{width:24px;height:24px;display:grid;place-items:center;font-family:var(--f-pixel);font-weight:700;font-size:15px;clip-path:var(--step-s);margin-top:1px}
.checks .st.scan{background:#3a3160;color:var(--gold);animation:pulse .5s steps(2) infinite}
.checks .st.ok{background:var(--safe);color:#06201c}
.checks .st.bad{background:var(--danger);color:#2a0710}
.checks b{display:block;font-size:14px;line-height:1.25}
.checks span{display:block;font-size:14px;line-height:1.4;color:#e3dbf2}
.verdict{display:flex;align-items:center;gap:10px;padding:10px 12px;clip-path:var(--step-s);font-family:var(--f-pixel);font-weight:700;font-size:17px;line-height:1.2}
.verdict.good{background:var(--safe);color:#06201c}
.verdict.bad{background:var(--danger);color:#2a0710}
.verdict.mid{background:var(--gold);color:#1d1206}
.verdict svg{width:22px;height:22px;flex:none}
.btn.safe .in,.verdict.good .in{fill:var(--safe)}.verdict.bad .in{fill:var(--danger)}.verdict.mid .in{fill:var(--gold)}
.delta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-pixel);font-weight:500;font-size:13px;padding:3px 8px;background:var(--panel-hi);clip-path:var(--step-s);font-variant-numeric:tabular-nums}
.chip.neg{color:#ffb3bf}
.chip.pos{color:#9ff0df}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.flags li{font-size:14px;line-height:1.3;padding:5px 9px;background:#3a1c2c;color:#ffd6dc;clip-path:var(--step-s)}
.flags.good li{background:#123832;color:#c8fff2}
.note{font-size:15px;color:#e8e0f6}
.real{font-size:14px;color:var(--muted);border-top:2px dashed #3a2f5c;padding-top:10px}
.real b{color:var(--text)}

/* Station stop */
.board{background:var(--board);color:var(--board-ink);clip-path:var(--step-s);box-shadow:inset 0 0 0 3px var(--board-ink),inset 0 0 0 5px var(--board);padding:10px 12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0}
.board .hi{font-family:var(--f-body);font-weight:800;font-size:26px;line-height:1.1}
.board .en{font-family:var(--f-pixel);font-weight:700;font-size:24px;letter-spacing:.12em;line-height:1.1}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;border:0;background:var(--panel-hi);padding:11px 12px;cursor:pointer;clip-path:var(--step-s);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)}
.choice:hover{background:#352a5c}
.choice:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--gold)}
.choice:active{transform:translateY(2px)}
.choice[disabled]{opacity:.45;cursor:not-allowed}
.choice b{font-family:var(--f-pixel);font-weight:700;font-size:16px;line-height:1.2}
.choice span{grid-column:1;font-size:14px;line-height:1.35;color:var(--muted)}
.choice .fx{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-style:normal}
.choice .fx i{font-style:normal;font-family:var(--f-pixel);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pos{color:#9ff0df}.neg{color:#ffb3bf}

/* End */
.score-big{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.score-big b{font-family:var(--f-pixel);font-weight:700;font-size:44px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.rank{font-family:var(--f-pixel);font-weight:700;font-size:15px;padding:4px 10px;background:var(--safe);color:#06201c;clip-path:var(--step-s)}
.tbl{display:flex;flex-direction:column;gap:2px;margin:0}
.tbl div{display:flex;justify-content:space-between;gap:12px;padding:6px 2px;border-bottom:1px solid #2e2550;font-size:15px}
.tbl dt{color:#e8e0f6}
.tbl dd{margin:0;font-family:var(--f-pixel);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .tot{border-bottom:0;padding-top:8px}
.tbl .tot dd{color:var(--gold);font-size:18px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--panel-hi);padding:9px 10px;clip-path:var(--step-s);min-width:0}
.stat b{display:block;font-family:var(--f-pixel);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:13px;line-height:1.3;color:var(--muted)}
details.q{background:#1e1838;clip-path:var(--step-s);padding:9px 11px}
details.q summary{cursor:pointer;font-size:15px;line-height:1.35;list-style:none}
details.q summary::-webkit-details-marker{display:none}
details.q summary::after{content:" +";font-family:var(--f-pixel);color:var(--gold)}
details.q[open] summary::after{content:" −"}
details.q p{margin-top:6px;font-size:14px;color:#c8fff2}
.help{background:#123832;color:#d6fff6;padding:10px 12px;clip-path:var(--step-s);font-size:15px}
.help b{color:#fff}
.help a{color:#9ff0df}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg .btn[aria-pressed="true"],.help .btn[aria-pressed="true"]{background:var(--gold);color:#1d1206}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--panel);box-shadow:inset 0 0 0 3px var(--edge);clip-path:var(--step-s);padding:8px 14px;font-family:var(--f-pixel);font-size:14px;pointer-events:none}
.rmap{display:flex;flex-direction:column}
.stn{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;text-align:left;border:0;background:transparent;padding:6px 4px 16px;position:relative;cursor:pointer;width:100%}
.stn:not(:last-child)::after{content:"";position:absolute;left:26px;top:54px;bottom:0;width:4px;background:repeating-linear-gradient(to bottom,#6a5a9a 0 6px,#2e2550 6px 10px)}
.stn .pin{width:44px;height:44px;display:grid;place-items:center;font-family:var(--f-pixel);font-weight:700;font-size:20px;clip-path:var(--step);background:#4a4560;color:#b0aac6}
.stn.done .pin{background:var(--gold);color:#1d1206}
.stn.cur .pin{background:var(--saffron);color:#1d1206;animation:pulse 1.1s steps(2) infinite}
.stn.lock{cursor:not-allowed;opacity:.75}
.stn:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--gold)}
.stn b{display:block;font-family:var(--f-pixel);font-size:16px;line-height:1.2}
.stn small{display:block;font-size:13px;line-height:1.35;color:var(--muted)}
.stars,.starsbig{font-style:normal;color:var(--gold);letter-spacing:.1em}.stars{display:block;font-size:16px}.starsbig{font-size:34px;line-height:1;letter-spacing:.12em}
.stars i,.starsbig i{font-style:normal;color:#4a4560}
html[lang=hi] .panel *,html[lang=hi] .btn{letter-spacing:0!important;text-transform:none!important}
@media (prefers-reduced-motion: reduce){.pulse,.call .ring,.vid img,.checks .st.scan,.panel{animation:none}}
</style>

<canvas id="game" aria-label="Paisa Safar game. Tap or press Space to jump."></canvas>
<div id="crt"></div>
<div id="probe"></div>
<div id="ui">
  <div id="title-ui" hidden>
    <p class="tag" id="t-tag"></p>
    <div class="acts">
      <button class="btn" id="b-start"></button>
      <div class="row">
        <button class="btn ghost small" id="b-how"></button>
        <button class="btn ghost small" id="b-lang">EN / हिं</button>
        <button class="btn ghost small" id="b-sound"></button>
        <button class="btn ghost small" id="b-player"></button>
      </div>
      <button class="btn ghost small" id="b-senior"></button>
    </div>
    <p class="fine" id="t-fine"></p>
  </div>
  <button class="icon-btn" id="pause-btn" hidden aria-label="Pause"></button>
</div>
<div id="panel-wrap" hidden></div>

<script>
(()=>{
"use strict";
/* =====================================================================
   PAISA SAFAR · prototype with 4 levels (scams, F&O, mutual funds, fundamentals)
   Original pixel art, drawn in code. All people, brands, apps and coins
   are fictional. No data leaves the device.
   ===================================================================== */

/* ---------- utils ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const H2R={};
function hex2rgb(h){let r=H2R[h];if(r)return r;const s=h.replace('#','');r=[parseInt(s.substr(0,2),16),parseInt(s.substr(2,2),16),parseInt(s.substr(4,2),16)];H2R[h]=r;return r}
function rgb2hex(r,g,b){return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t))}
function shade(c,amt){return amt>=0?mix(c,'#fff6e0',amt):mix(c,'#140c26',-amt)}
function rgba(h,a){const c=hex2rgb(h);return `rgba(${c[0]},${c[1]},${c[2]},${a})`}
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RNG=mulberry(Date.now()&0xffffffff);

function genKiosk(){const w=24,h=26;return mkSprite(w,h,(P,L)=>{const tarp=pick(['#2f6fb0','#e8402a','#3fb36a']);P.r(0,2,w,4,tarp);for(let x=0;x<w;x+=3)P.p(x,6,tarp);P.r(2,6,1,h-6,'#6a4a2a');P.r(w-3,6,1,h-6,'#6a4a2a');P.r(1,14,w-2,12,'#8a5a2f');P.r(1,14,w-2,2,'#a87a4a');for(let i=0;i<14;i++)P.p(rr(3,w-3),rr(8,13),pick(['#ffd23f','#e8402a','#3fd0b6','#f4efe2','#ff8a1a']));P.r(w/2,6,1,2,'#3a3a3a');P.p(w/2,8,'#fff3b0');L.win(w/2-1,8,3,2,'#fff3b0');P.meta.lamp=[w/2+1,9]})}
function genAuto(){return mkSprite(26,18,P=>{const body=pick(['#2f8a4a','#1c1c24']),top='#f2c230';P.r(4,0,18,3,top);P.r(4,3,2,7,top);P.r(20,3,2,7,'#3a3a46');P.r(2,9,22,6,body);P.r(1,10,3,4,top);P.r(6,4,12,5,'#24203a');P.r(6,4,12,1,'#3c3760');P.ell(5,15,2,2,'#1a1a20');P.ell(21,15,2,2,'#1a1a20');P.p(5,15,'#8a8a92');P.p(21,15,'#8a8a92');P.p(1,11,'#fff3b0')})}
function genNear(th){const k=pick(th.near);if(k==='tree')return genTree();if(k==='palm')return genPalm();if(k==='wall')return genWall();if(k==='pole'){const s=genPole();s.meta.pole=true;return s}if(k==='kiosk')return genKiosk();if(k==='auto')return genAuto();return genTree()}
function genCloud(){const w=40+ri(0,40),h=16+ri(0,8);return mkSprite(w,h,P=>{for(let i=0;i<7;i++)P.ell(rr(8,w-8),rr(h*.45,h-6),ri(5,9),ri(4,6),'#ffffff');P.r(4,h-5,w-8,4,'#dfe6f2');for(let i=0;i<4;i++)P.ell(rr(8,w-8),h-4,ri(4,7),2,'#c9d2e4')},{outline:null})}

  if(SENIOR&&state==='run'&&hero.ground){const ah=W.obs.find(o=>o.x>heroWX()-4&&o.x-heroWX()<(o.k==='trolley'?40:30));if(ah)doJump(true)}

  else if(a==='crt'){$('crt').hidden=!$('crt').hidden;store.set('crt',!$('crt').hidden);paused=false;state=pauseFrom;openPause()}
  else if(a==='conf0'){store.set('conf0',+b.dataset.v);toast(T('confSaved'));openMap()}
  else if(a==='conf1'){store.set('conf1',+b.dataset.v);toast(T('confSaved'));PW.querySelectorAll('[data-act=conf1]').forEach(x=>x.setAttribute('aria-pressed',x===b));const rc=$('rescode');if(rc&&G)rc.textContent=resCode()}
  else if(a==='copycode'){const code=G?resCode():'';try{navigator.clipboard.writeText(code).then(()=>toast(T('codeCopied')),()=>toast(T('copyFail')))}catch(err){toast(T('copyFail'))}}
  else if(a==='copy'){const s=T('parivarT')+' (Paisa Safar)\n'+PARIVAR.map((q,i)=>(i+1)+'. '+tx(q.q)).join('\n');const done=()=>toast(T('copied')),fail=()=>{toast(T('copyFail'));const d=PW.querySelector('details.q');if(d){PW.querySelectorAll('details.q').forEach(x=>x.open=true)}};try{navigator.clipboard.writeText(s).then(done,fail)}catch(err){fail()}}
});
function toast(s){const t=document.createElement('div');t.className='toast';t.textContent=s;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='run')openPause()});

function frame(ts){requestAnimationFrame(frame);const dt=lastTs?Math.min(.05,(ts-lastTs)/1000):0;lastTs=ts;if(!paused)update(dt);render()}
$('crt').hidden=!store.get('crt',true);
document.documentElement.lang=LANG==='hi'?'hi':'en';

const mkHi=()=>{hiTitle=hiSprite('पैसा सफ़र',VW>VH?14:16,'#fff6e0','#140c1e');W.boards={};layoutTitle()};mkHi();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(mkHi);
window.__ps={get state(){return state},get G(){return G},get E(){return E},W,startJourney,startLevel,openMap,LEVELS,prog,CARDS,doVerify,resolve,endEncounter,stopChoice,setLang};
})();
